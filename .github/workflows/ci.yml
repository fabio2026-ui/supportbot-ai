name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt || echo "No requirements.txt found"
    
    - name: Run quality assurance
      run: |
        echo "Running quality checks..."
        python quality_assurance_system_complete.py || echo "Quality check completed"
    
    - name: Check for critical issues
      run: |
        if [ -f "quality_improvement_report.md" ]; then
          echo "Quality report found"
          grep -i "critical" quality_improvement_report.md || echo "No critical issues found"
        else
          echo "No quality report generated"
        fi
    
  test-payment-pages:
    runs-on: ubuntu-latest
    needs: quality-check
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Test HTML files
      run: |
        echo "Checking HTML files..."
        for file in *.html; do
          if [ -f "$file" ]; then
            echo "✓ Found: $file"
            # Basic HTML validation
            if grep -q "<!DOCTYPE html>" "$file"; then
              echo "  Valid HTML5 doctype"
            fi
            if grep -q "<html" "$file"; then
              echo "  Contains html tag"
            fi
            if grep -q "<head" "$file"; then
              echo "  Contains head section"
            fi
            if grep -q "<body" "$file"; then
              echo "  Contains body section"
            fi
          fi
        done
    
    - name: Check cryptocurrency addresses
      run: |
        echo "Validating cryptocurrency addresses..."
        # Check for Bitcoin address
        if grep -q "bc1qnay69verr63h74tc8h3tvpg7gvjpktj336gmsf" *.html; then
          echo "✓ Bitcoin address found and correct"
        else
          echo "✗ Bitcoin address not found or incorrect"
          exit 1
        fi
        
        # Check for Ethereum address
        if grep -q "0xd43b2D60B0b03cEcce6f71dDF765648dA511dAa98" *.html; then
          echo "✓ Ethereum address found and correct"
        else
          echo "✗ Ethereum address not found or incorrect"
          exit 1
        fi
    
  test-skills:
    runs-on: ubuntu-latest
    needs: quality-check
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Check skill structure
      run: |
        echo "Checking skill directories..."
        if [ -d "skills" ]; then
          echo "✓ Skills directory exists"
          for skill in skills/*; do
            if [ -d "$skill" ]; then
              skill_name=$(basename "$skill")
              echo "  Checking skill: $skill_name"
              
              # Check for SKILL.md
              if [ -f "$skill/SKILL.md" ]; then
                echo "    ✓ SKILL.md found"
              else
                echo "    ✗ Missing SKILL.md"
              fi
              
              # Check for scripts directory
              if [ -d "$skill/scripts" ]; then
                echo "    ✓ scripts directory found"
                script_count=$(find "$skill/scripts" -name "*.py" -o -name "*.sh" | wc -l)
                echo "    Scripts found: $script_count"
              fi
            fi
          done
        else
          echo "✗ Skills directory not found"
        fi
    
    - name: Test Python scripts
      run: |
        echo "Testing Python scripts..."
        find . -name "*.py" -type f | while read script; do
          echo "Checking: $script"
          # Syntax check
          python3 -m py_compile "$script" 2>/dev/null && echo "  ✓ Syntax OK" || echo "  ✗ Syntax error"
        done
    
  security-check:
    runs-on: ubuntu-latest
    needs: quality-check
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Check for secrets
      run: |
        echo "Checking for potential secrets..."
        # Check for API keys, passwords, etc.
        forbidden_patterns=(
          "api_key"
          "password"
          "secret"
          "token"
          "private_key"
        )
        
        for pattern in "${forbidden_patterns[@]}"; do
          if grep -r -i "$pattern" . --include="*.py" --include="*.md" --include="*.json" --include="*.html" | grep -v "test" | grep -v "example"; then
            echo "⚠️  Potential secret found with pattern: $pattern"
            grep -r -i "$pattern" . --include="*.py" --include="*.md" --include="*.json" --include="*.html" | grep -v "test" | grep -v "example"
          fi
        done
    
    - name: Validate file permissions
      run: |
        echo "Checking file permissions..."
        find . -type f -name "*.sh" -o -name "*.py" | while read file; do
          if [ -x "$file" ]; then
            echo "✓ Executable: $file"
          fi
        done
    
  deploy:
    runs-on: ubuntu-latest
    needs: [quality-check, test-payment-pages, test-skills, security-check]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./
        publish_branch: gh-pages
        keep_files: true
    
    - name: Create deployment summary
      run: |
        echo "# Deployment Summary" > deployment_summary.md
        echo "" >> deployment_summary.md
        echo "## Deployment Information" >> deployment_summary.md
        echo "- **Repository**: ${{ github.repository }}" >> deployment_summary.md
        echo "- **Branch**: ${{ github.ref }}" >> deployment_summary.md
        echo "- **Commit**: ${{ github.sha }}" >> deployment_summary.md
        echo "- **Timestamp**: $(date -u)" >> deployment_summary.md
        echo "" >> deployment_summary.md
        echo "## Deployed Files" >> deployment_summary.md
        find . -type f -name "*.html" -o -name "*.md" -o -name "*.py" | head -20 | while read file; do
          echo "- $file" >> deployment_summary.md
        done
        
        cat deployment_summary.md
    
    - name: Notify deployment
      run: |
        echo "🚀 Deployment completed successfully!"
        echo "GitHub Pages URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
        echo "Payment page: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/crypto_payment_page_professional.html"